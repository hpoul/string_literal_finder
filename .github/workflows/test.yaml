name: test and coverage

on: [push]

jobs:
  test:
    strategy:
      matrix:
        os: ['ubuntu-latest']
        dart_channel: ['stable']
        # Analysis only covers the package you stand in, so each one is
        # analyzed separately rather than once from the repository root.
        include:
          # `example/` is deliberately full of string literals, so the plugin
          # reports them and `--fatal-infos` over the whole package would fail.
          - package: string_literal_finder
            analyze: lib bin test tool
          - package: string_literal_finder_annotations
            analyze: lib test

      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart_channel }}
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos ${{ matrix.analyze }}
      - name: Run tests
        run: dart test
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: dev
      - run: cd packages/string_literal_finder && _tool/test-coverage.sh
      - name: Coveralls
        uses: coverallsapp/github-action@1.1.3
        env:
          COVERALLS_FLAG_NAME: Unit
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-path: packages/string_literal_finder
          path-to-lcov: packages/string_literal_finder/coverage/lcov.info
